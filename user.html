  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #00ffff;
      font-family: 'Share Tech Mono', monospace;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Starfield canvas ── */
    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ── Scanline overlay ── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,255,255,.012) 3px, rgba(0,255,255,.012) 4px);
    }

    /* ── TOP BAR ── */
    #topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 56px;
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 16px;
      background: linear-gradient(180deg, rgba(0,0,0,.95) 0%, transparent 100%);
      border-bottom: 1px solid #00ffff18;
      z-index: 100;
    }
    .brand {
      font-family: 'Orbitron', sans-serif;
      font-size: 16px;
      font-weight: 900;
      color: #00ffff;
      letter-spacing: 4px;
      text-shadow: 0 0 20px #00ffff88;
    }
    #user-badge {
      margin-left: 14px;
      padding: 4px 12px;
      background: rgba(0,255,136,.08);
      border: 1px solid rgba(0,255,136,.3);
      border-radius: 20px;
      color: #00ff88;
      font-size: 10px;
      letter-spacing: 2px;
    }
    #topbar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    #clock {
      font-size: 11px;
      color: #00ffff88;
    }
    #btn-logout {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(255,60,60,.08);
      border: 1px solid rgba(255,80,80,.35);
      color: #ff6666;
      font-family: 'Orbitron', sans-serif;
      font-size: 9px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all .25s;
    }
    #btn-logout:hover {
      background: rgba(255,60,60,.25);
      border-color: #ff4444;
      color: #fff;
      box-shadow: 0 0 12px rgba(255,60,60,.4);
    }

    /* ── MAIN LAYOUT ── */
    #main {
      position: fixed;
      inset: 56px 0 0 0;
      display: grid;
      grid-template-columns: 1fr 360px;
      grid-template-rows: 1fr;
      gap: 0;
      z-index: 10;
    }

    /* ── LEFT: Character slot + AI agents ── */
    #left-panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-right: 1px solid #00ffff11;
    }

    /* Character placeholder */
    #char-slot {
      flex: 0 0 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #00ffff11;
      position: relative;
      background: radial-gradient(ellipse 80% 80% at 50% 50%, rgba(0,50,80,.25) 0%, transparent 70%);
    }
    #char-slot-ring {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 2px dashed rgba(0,255,255,.2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      position: relative;
      animation: ringPulse 4s ease-in-out infinite;
    }
    #char-slot-ring::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 1px solid rgba(0,255,255,.08);
    }
    @keyframes ringPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(0,255,255,.1), inset 0 0 30px rgba(0,255,255,.04); }
      50% { box-shadow: 0 0 0 12px rgba(0,255,255,.04), inset 0 0 40px rgba(0,255,255,.08); }

    .char-icon { font-size: 40px; opacity: .35; }
    .char-hint {

      color: rgba(0,255,255,.3);
      letter-spacing: 2px;
      text-align: center;
      line-height: 1.6;
    }
    #char-slot-label {
      position: absolute;
      top: 12px;
      left: 20px;

      font-size: 8px;
      color: rgba(0,255,255,.25);
      letter-spacing: 3px;

      font-family: 'Orbitron', sans-serif;
      font-size: 8px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all .25s;

    #btn-create-char:hover {

      border-color: rgba(255,170,0,.7);
      color: #ffaa00;
      box-shadow: 0 0 10px rgba(255,170,0,.2);
    }

    /* Agent grid */

      overflow-y: auto;
      padding: 16px 20px;
      scrollbar-width: thin;
      scrollbar-color: rgba(0,255,255,.1) transparent;
    }
    #agent-section-hdr {
      font-family: 'Orbitron', sans-serif;
      font-size: 9px;
      color: rgba(0,255,255,.4);
      letter-spacing: 3px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;

      height: 1px;
      background: linear-gradient(90deg, rgba(0,255,255,.15), transparent);

    #agent-grid {

      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));

// ── Starfield canvas ──
(function() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let stars = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    stars = Array.from({ length: 140 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.2 + 0.2,
      a: Math.random(),
      speed: Math.random() * 0.4 + 0.1,
      dir: Math.random() > 0.5 ? 1 : -1
    }));
  }
  window.addEventListener('resize', resize);
  resize();

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    stars.forEach(s => {
      s.a += s.speed * 0.01 * s.dir;
      if (s.a > 1 || s.a < 0) s.dir *= -1;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(180,220,255,${s.a * 0.8})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

// ── Toast ──
function showToast(msg, duration = 3000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');

}

// ── Render agent grid ──
const grid = document.getElementById('agent-grid');
AGENTS.forEach(ag => {
  const card = document.createElement('div');
  card.className = 'agent-card';
  card.style.setProperty('--c', ag.color + '20');
  card.innerHTML = `
    <div class="astatus"></div>
    <div class="emoji">${ag.emoji}</div>
    <div class="aname">${ag.name}</div>
    <div class="arev">${ag.revenue}</div>
  `;
  card.onclick = () => openDetail(ag);
  grid.appendChild(card);
});

// ── Agent detail ──
let currentAgent = null;
function openDetail(ag) {
  currentAgent = ag;
  const box = document.getElementById('ad-box');
  box.style.setProperty('--adc', ag.color);
  document.getElementById('ad-emoji').textContent = ag.emoji;
  document.getElementById('ad-name').textContent = ag.name;
  document.getElementById('ad-type').textContent = ag.type;
  document.getElementById('ad-rev').textContent = ag.revenue + ' / NGÀY';
  document.getElementById('ad-stats').innerHTML = `
    <div class="ad-stat"><div class="ad-stat-val">${ag.auto}</div><div class="ad-stat-lbl">TỰ ĐỘNG</div></div>
    <div class="ad-stat"><div class="ad-stat-val">${ag.neural}</div><div class="ad-stat-lbl">THẦN KINH</div></div>
    <div class="ad-stat"><div class="ad-stat-val">${ag.iq}</div><div class="ad-stat-lbl">TRÍ TUỆ</div></div>
  `;
  document.getElementById('ad-apis').innerHTML = ag.apis.map(a => `<span class="ad-api">${a}</span>`).join('');
  document.getElementById('agent-detail').classList.add('open');
}
function closeDetail() {
  document.getElementById('agent-detail').classList.remove('open');
  currentAgent = null;
}
function chatWithAgent() {
  if (!currentAgent) return;
  closeDetail();
  const name = currentAgent.name;
  const type = currentAgent.type;
  addMsg('ai', `Ta là ${name} — ${type}. Đạo hữu muốn ta hé lộ bí quyết nào?`, '🤖 ' + name.toUpperCase());
  document.getElementById('chat-input').focus();
}

// ── Chat ──
const chatHistory = [];
let chatLoading = false;
let activeSender = 'THIÊN CƠ CÁC';
let activePersonality = null;

function addMsg(type, text, sender) {
  const msgs = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = `msg ${type}`;
  div.innerHTML = `<div class="msg-sender">${sender || (type === 'user' ? 'ĐẠO HỮU' : activeSender)}</div><div class="msg-bubble">${text.replace(/\n/g, '<br>')}</div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function addTyping() {
  const msgs = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.id = 'typing-indicator';
  div.innerHTML = `<div class="msg-sender">${activeSender}</div><div class="msg-bubble"><span class="typing-dots"><span>●</span><span>●</span><span>●</span></span></div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing-indicator');
  if (t) t.remove();
}

async function sendChat() {
  if (chatLoading) return;
  const input = document.getElementById('chat-input');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';

  addMsg('user', msg);
  chatHistory.push({ sender: 'ĐẠO HỮU', text: msg });

  chatLoading = true;
  document.getElementById('btn-send').disabled = true;
  addTyping();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg, history: chatHistory, agentPersonality: activePersonality })
    });
    const data = await res.json();
    removeTyping();
    addMsg('ai', data.reply);
    chatHistory.push({ sender: activeSender, text: data.reply });
    if (chatHistory.length > 30) chatHistory.splice(0, 2);
  } catch {
    removeTyping();
    addMsg('ai', 'Linh khí hỗn loạn... vui lòng thử lại.');
  } finally {
    chatLoading = false;
    document.getElementById('btn-send').disabled = false;
  }
}

// ── ESC to close detail ──
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDetail();
  if (e.key === 'Enter' && document.activeElement === document.getElementById('chat-input')) {
    sendChat();
  }
});
</script>
