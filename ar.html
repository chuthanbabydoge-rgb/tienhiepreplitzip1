<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>VƯƠNG ĐẾ AR — Không Gian 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #00ffff;
      font-family: 'Share Tech Mono', monospace;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    canvas { display: block; }

    /* ── Overlay UI ── */
    #overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
    }

    /* ── Start Screen ── */
    #start-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, #000a14 0%, #000 70%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      z-index: 200;
    }

    .ar-logo {
      font-family: 'Orbitron', sans-serif;
      font-size: 28px;
      font-weight: 900;
      color: #00ffff;
      letter-spacing: 8px;
      text-shadow: 0 0 30px #00ffff88, 0 0 60px #00ffff44;
      animation: logoPulse 3s ease-in-out infinite;
    }

    @keyframes logoPulse {
      0%, 100% { text-shadow: 0 0 30px #00ffff88, 0 0 60px #00ffff44; }
      50% { text-shadow: 0 0 50px #00ffffcc, 0 0 100px #00ffff66; }
    }

    .ar-subtitle {
      font-size: 12px;
      color: rgba(0,255,255,.5);
      letter-spacing: 4px;
      text-align: center;
      line-height: 1.8;
    }

    .ar-ring {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 2px solid rgba(0,255,255,.3);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      animation: ringRotate 8s linear infinite;
    }
    .ar-ring::before {
      content: '';
      position: absolute;
      inset: -15px;
      border-radius: 50%;
      border: 1px solid rgba(0,255,255,.1);
      animation: ringRotate 5s linear infinite reverse;
    }
    .ar-ring::after {
      content: '⬡';
      font-size: 60px;
      color: rgba(0,255,255,.6);
      text-shadow: 0 0 20px #00ffff;
    }
    @keyframes ringRotate {
      to { transform: rotate(360deg); }
    }

    #btn-start-ar {
      padding: 16px 48px;
      background: transparent;
      border: 2px solid #00ffff;
      color: #00ffff;
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 4px;
      cursor: pointer;
      transition: all .3s;
      position: relative;
      overflow: hidden;
      pointer-events: all;
    }
    #btn-start-ar::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0,255,255,.08);
      transform: scaleX(0);
      transition: transform .3s;
    }
    #btn-start-ar:hover { box-shadow: 0 0 30px rgba(0,255,255,.4); }
    #btn-start-ar:hover::before { transform: scaleX(1); }

    #btn-back-home {
      padding: 10px 28px;
      background: transparent;
      border: 1px solid rgba(0,255,255,.3);
      color: rgba(0,255,255,.5);
      font-family: 'Orbitron', sans-serif;
      font-size: 9px;
      letter-spacing: 3px;
      cursor: pointer;
      transition: all .25s;
      pointer-events: all;
    }
    #btn-back-home:hover { border-color: rgba(0,255,255,.7); color: #00ffff; }

    #ar-support-msg {
      font-size: 10px;
      color: rgba(255,180,0,.6);
      text-align: center;
      max-width: 320px;
      line-height: 1.6;
    }

    /* ── AR HUD (shown while in AR) ── */
    #ar-hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 150;
      display: none;
    }

    #hud-top {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, rgba(0,0,0,.6) 0%, transparent 100%);
    }

    .hud-brand {
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      font-weight: 900;
      color: #00ffff;
      letter-spacing: 4px;
      text-shadow: 0 0 15px #00ffff88;
    }

    .hud-status {
      font-size: 9px;
      color: #00ff88;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hud-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #00ff88;
      box-shadow: 0 0 8px #00ff88;
      animation: blink 1.5s infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

    #hud-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background: linear-gradient(0deg, rgba(0,0,0,.6) 0%, transparent 100%);
      pointer-events: all;
    }

    #scan-hint {
      font-size: 11px;
      color: rgba(0,255,255,.7);
      letter-spacing: 2px;
      text-align: center;
    }

    #btn-place {
      padding: 14px 40px;
      background: rgba(0,255,136,.1);
      border: 2px solid #00ff88;
      color: #00ff88;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      cursor: pointer;
      border-radius: 2px;
      transition: all .25s;
      display: none;
    }
    #btn-place:hover { background: rgba(0,255,136,.2); box-shadow: 0 0 20px rgba(0,255,136,.3); }

    #btn-reset {
      padding: 10px 28px;
      background: rgba(255,100,100,.08);
      border: 1px solid rgba(255,100,100,.4);
      color: rgba(255,120,120,.8);
      font-family: 'Orbitron', sans-serif;
      font-size: 9px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all .25s;
      display: none;
    }
    #btn-reset:hover { background: rgba(255,100,100,.2); }

    #btn-exit-ar {
      padding: 10px 28px;
      background: transparent;
      border: 1px solid rgba(255,255,255,.2);
      color: rgba(255,255,255,.5);
      font-family: 'Orbitron', sans-serif;
      font-size: 9px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all .25s;
    }
    #btn-exit-ar:hover { border-color: rgba(255,255,255,.6); color: #fff; }

    /* Panel buttons row */
    #panel-controls {
      display: none;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .panel-btn {
      padding: 8px 16px;
      background: rgba(0,255,255,.08);
      border: 1px solid rgba(0,255,255,.3);
      color: rgba(0,255,255,.8);
      font-family: 'Orbitron', sans-serif;
      font-size: 8px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all .2s;
    }
    .panel-btn:hover { background: rgba(0,255,255,.2); border-color: #00ffff; color: #00ffff; }
    .panel-btn.active { background: rgba(0,255,255,.2); border-color: #00ffff; color: #00ffff; box-shadow: 0 0 10px rgba(0,255,255,.3); }

    /* ── Fallback (non-WebXR) AR simulation ── */
    #fallback-screen {
      position: fixed;
      inset: 0;
      z-index: 180;
      display: none;
    }

    #camera-feed {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      inset: 0;
    }

    #ar-overlay-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* ── Loading ── */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: #000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 250;
    }
    .loading-ring {
      width: 60px; height: 60px;
      border: 2px solid rgba(0,255,255,.1);
      border-top-color: #00ffff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 11px; color: rgba(0,255,255,.6); letter-spacing: 3px; }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>

<!-- Loading -->
<div id="loading-screen">
  <div class="loading-ring"></div>
  <div class="loading-text">KHỞI TẠO HỆ THỐNG AR...</div>
</div>

<!-- Start Screen -->
<div id="start-screen">
  <div class="ar-logo">VƯƠNG ĐẾ AR</div>
  <div class="ar-ring"></div>
  <div class="ar-subtitle">GIAO DIỆN KHÔNG GIAN 3D<br>QUÉT BỀ MẶT — ĐẶT PORTAL TU TIÊN</div>
  <button id="btn-start-ar" onclick="startAR()">▶ KÍCH HOẠT AR</button>
  <div id="ar-support-msg">Yêu cầu: Chrome Android 12+ hoặc Safari iOS 16+ với ARKit. Thiết bị cần có camera và cảm biến chuyển động.</div>
  <button id="btn-back-home" onclick="window.location.href='/user'">← QUAY LẠI</button>
</div>

<!-- AR HUD -->
<div id="ar-hud">
  <div id="hud-top">
    <div class="hud-brand">VƯƠNG ĐẾ AR</div>
    <div class="hud-status">
      <div class="hud-dot"></div>
      <span id="hud-status-text">ĐANG QUÉT...</span>
    </div>
  </div>
  <div id="hud-bottom">
    <div id="scan-hint">Hướng camera xuống bề mặt phẳng</div>
    <button id="btn-place" onclick="placePanel()">⬡ ĐẶT PORTAL TẠI ĐÂY</button>
    <div id="panel-controls">
      <button class="panel-btn active" onclick="switchPanel('agents')" id="pb-agents">THẦN LINH</button>
      <button class="panel-btn" onclick="switchPanel('char')" id="pb-char">NHÂN VẬT</button>
      <button class="panel-btn" onclick="switchPanel('chat')" id="pb-chat">ĐỐI THOẠI</button>
      <button class="panel-btn" onclick="switchPanel('vault')" id="pb-vault">KHO BÁU</button>
    </div>
    <button id="btn-reset" onclick="resetPanel()">↺ ĐẶT LẠI VỊ TRÍ</button>
    <button id="btn-exit-ar" onclick="exitAR()">✕ THOÁT AR</button>
  </div>
</div>

<!-- Fallback for non-WebXR browsers -->
<div id="fallback-screen">
  <video id="camera-feed" autoplay playsinline muted></video>
  <canvas id="ar-overlay-canvas"></canvas>
  <div id="ar-hud" style="display:block"></div>
</div>

<!-- Three.js canvas will be inserted here by JS -->
<div id="webxr-container"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ── State ──
let renderer, scene, camera, xrSession = null;
let reticle, hitTestSource = null, hitTestSourceRequested = false;
let panelPlaced = false;
let panelGroup = null;
let activePanel = 'agents';
let userData = null;
let agentsData = [];
let panelMeshes = {};
let currentTextures = {};

// ── Hand Tracking State ──
let handTrackingAvailable = false;
let handJointMeshes = { left: {}, right: {} };
let pinchActive = { left: false, right: false };
let lastPinchTime = 0;
const PINCH_THRESHOLD = 0.035; // meters

// ── Gaze / Interaction State ──
let gazeRaycaster = new THREE.Raycaster();
let gazeCursor = null;
let gazeProgressMesh = null;
let interactiveZones = [];
let gazeTarget = null;
let gazeDwellStart = null;
const GAZE_DWELL_MS = 1500;
let handPointerLine = null;

// ── Swipe / Touch State ──
let touchStartX = 0, touchStartY = 0;
const panels = ['agents', 'char', 'chat', 'vault'];

// ── Init Three.js ──
function initThree() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  renderer.setClearColor(0x000000, 0);

  document.getElementById('webxr-container').appendChild(renderer.domElement);

  // Ambient light
  const ambient = new THREE.AmbientLight(0x00ffff, 0.4);
  scene.add(ambient);

  const dirLight = new THREE.DirectionalLight(0x00ffff, 0.8);
  dirLight.position.set(0, 5, 5);
  scene.add(dirLight);

  // Reticle (surface indicator)
  const reticleGeo = new THREE.RingGeometry(0.08, 0.1, 32);
  const reticleMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, side: THREE.DoubleSide });
  reticle = new THREE.Mesh(reticleGeo, reticleMat);
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);

  // Inner reticle dot
  const dotGeo = new THREE.CircleGeometry(0.015, 16);
  const dotMat = new THREE.MeshBasicMaterial({ color: 0x00ff88, side: THREE.DoubleSide });
  const dot = new THREE.Mesh(dotGeo, dotMat);
  reticle.add(dot);

  // ── Gaze cursor (center crosshair + dwell ring) ──
  const cursorGroup = new THREE.Group();

  const crossH = new THREE.PlaneGeometry(0.012, 0.002);
  const crossV = new THREE.PlaneGeometry(0.002, 0.012);
  const crossMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8, depthTest: false });
  cursorGroup.add(new THREE.Mesh(crossH, crossMat));
  cursorGroup.add(new THREE.Mesh(crossV, crossMat));

  const outerRingGeo = new THREE.RingGeometry(0.007, 0.009, 32);
  const outerRingMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.6, side: THREE.DoubleSide, depthTest: false });
  cursorGroup.add(new THREE.Mesh(outerRingGeo, outerRingMat));

  const progressGeo = new THREE.RingGeometry(0.010, 0.013, 32, 1, 0, 0);
  const progressMat = new THREE.MeshBasicMaterial({ color: 0x00ff88, transparent: true, opacity: 0, side: THREE.DoubleSide, depthTest: false });
  gazeProgressMesh = new THREE.Mesh(progressGeo, progressMat);
  cursorGroup.add(gazeProgressMesh);

  cursorGroup.name = 'gaze-cursor';
  cursorGroup.renderOrder = 999;
  scene.add(cursorGroup);
  gazeCursor = cursorGroup;

  // ── Hand pointer line (rendered when hand tracking active) ──
  const lineMat = new THREE.LineBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.7, depthTest: false });
  const lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-1)]);
  handPointerLine = new THREE.Line(lineGeo, lineMat);
  handPointerLine.visible = false;
  handPointerLine.renderOrder = 998;
  scene.add(handPointerLine);

  window.addEventListener('resize', onResize);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// ── Hand Tracking: Create joint sphere meshes ──
function initHandJoints(side) {
  const tipJoints = ['index-finger-tip', 'thumb-tip', 'middle-finger-tip'];
  tipJoints.forEach(joint => {
    const geo = new THREE.SphereGeometry(joint.includes('tip') ? 0.007 : 0.005, 8, 8);
    const mat = new THREE.MeshBasicMaterial({
      color: joint === 'index-finger-tip' ? 0x00ffff : joint === 'thumb-tip' ? 0x00ff88 : 0xffffff,
      transparent: true, opacity: 0.85
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.visible = false;
    scene.add(mesh);
    handJointMeshes[side][joint] = mesh;
  });
}

// ── Hand Tracking: Update joints per frame ──
function updateHandTracking(frame, refSpace) {
  const session = renderer.xr.getSession();
  if (!session.hand) return;

  ['left', 'right'].forEach(side => {
    const hand = session.inputSources.find(s => s.handedness === side && s.hand);
    if (!hand?.hand) {
      Object.values(handJointMeshes[side]).forEach(m => m.visible = false);
      return;
    }
    const tipJoints = ['index-finger-tip', 'thumb-tip', 'middle-finger-tip'];
    tipJoints.forEach(jointName => {
      const joint = hand.hand.get(jointName);
      if (!joint) return;
      const pose = frame.getJointPose(joint, refSpace);
      if (!pose) return;
      const m = handJointMeshes[side][jointName];
      if (m) {
        m.visible = true;
        m.position.set(
          pose.transform.position.x,
          pose.transform.position.y,
          pose.transform.position.z
        );
      }
    });

    // ── Pinch detection ──
    const indexTip = hand.hand.get('index-finger-tip');
    const thumbTip = hand.hand.get('thumb-tip');
    if (indexTip && thumbTip) {
      const iPose = frame.getJointPose(indexTip, refSpace);
      const tPose = frame.getJointPose(thumbTip, refSpace);
      if (iPose && tPose) {
        const dx = iPose.transform.position.x - tPose.transform.position.x;
        const dy = iPose.transform.position.y - tPose.transform.position.y;
        const dz = iPose.transform.position.z - tPose.transform.position.z;
        const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
        const nowPinching = dist < PINCH_THRESHOLD;
        if (nowPinching && !pinchActive[side]) {
          pinchActive[side] = true;
          const now = performance.now();
          if (now - lastPinchTime > 600) {
            lastPinchTime = now;
            // Cast ray from index tip forward
            if (iPose && panelGroup) {
              const origin = new THREE.Vector3(
                iPose.transform.position.x,
                iPose.transform.position.y,
                iPose.transform.position.z
              );
              const camPos = new THREE.Vector3();
              camera.getWorldPosition(camPos);
              const dir = origin.clone().sub(camPos).normalize();
              gazeRaycaster.set(origin, dir);
              const targets = interactiveZones.map(z => z.mesh);
              const hits = gazeRaycaster.intersectObjects(targets);
              if (hits.length > 0) {
                const zone = interactiveZones.find(z => z.mesh === hits[0].object);
                if (zone) activateZone(zone);
              }
            }
          }
        } else if (!nowPinching) {
          pinchActive[side] = false;
        }

        // Update hand pointer line (from index tip toward panel)
        if (side === 'right' && iPose) {
          const origin = new THREE.Vector3(
            iPose.transform.position.x,
            iPose.transform.position.y,
            iPose.transform.position.z
          );
          const camPos = new THREE.Vector3();
          camera.getWorldPosition(camPos);
          const dir = origin.clone().sub(camPos).normalize();
          const end = origin.clone().add(dir.clone().multiplyScalar(1.5));
          handPointerLine.geometry.setFromPoints([origin, end]);
          handPointerLine.visible = true;
        }
      }
    }
  });
}

// ── Create interactive 3D zone meshes for tab switching ──
function createInteractiveZones(group) {
  interactiveZones = [];
  const tabDefs = [
    { id: 'agents', label: '⬡ THẦN LINH', color: 0x00ffff },
    { id: 'char',   label: '☯ NHÂN VẬT',  color: 0xffaa00 },
    { id: 'chat',   label: '💬 ĐỐI THOẠI', color: 0x00ff88 },
    { id: 'vault',  label: '🏺 KHO BÁU',   color: 0xaa88ff },
  ];

  const totalW = 0.78;
  const tabW = totalW / tabDefs.length - 0.01;
  const tabH = 0.06;
  const startX = -totalW / 2 + tabW / 2;
  const tabY = 0.38;

  tabDefs.forEach((tab, i) => {
    const canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    const isActive = tab.id === activePanel;
    ctx.fillStyle = isActive ? `rgba(${hexToRGB(tab.color)},0.25)` : 'rgba(0,5,20,0.85)';
    ctx.fillRect(0, 0, 256, 64);
    ctx.strokeStyle = `rgba(${hexToRGB(tab.color)},${isActive ? 0.9 : 0.4})`;
    ctx.lineWidth = isActive ? 3 : 1.5;
    ctx.strokeRect(2, 2, 252, 60);
    ctx.font = 'bold 18px Orbitron, monospace';
    ctx.fillStyle = isActive ? `rgb(${hexToRGB(tab.color)})` : `rgba(${hexToRGB(tab.color)},0.6)`;
    ctx.textAlign = 'center';
    ctx.shadowColor = `rgb(${hexToRGB(tab.color)})`;
    ctx.shadowBlur = isActive ? 15 : 0;
    ctx.fillText(tab.label, 128, 40);
    const tex = new THREE.CanvasTexture(canvas);
    const geo = new THREE.PlaneGeometry(tabW, tabH);
    const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(startX + i * (tabW + 0.01), tabY, 0.001);
    group.add(mesh);

    interactiveZones.push({ mesh, action: () => window.switchPanel(tab.id), label: tab.label, tabId: tab.id, color: tab.color, tabIdx: i, tabW, tabH, startX });
  });
}

function hexToRGB(hex) {
  const r = (hex >> 16) & 255;
  const g = (hex >> 8) & 255;
  const b = hex & 255;
  return `${r},${g},${b}`;
}

// ── Refresh tab meshes when active panel changes ──
function refreshTabMeshes() {
  if (!panelGroup) return;
  interactiveZones.forEach(zone => {
    const tab = { agents: { label:'⬡ THẦN LINH', color:0x00ffff }, char: { label:'☯ NHÂN VẬT', color:0xffaa00 }, chat: { label:'💬 ĐỐI THOẠI', color:0x00ff88 }, vault: { label:'🏺 KHO BÁU', color:0xaa88ff } }[zone.tabId];
    const canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    const isActive = zone.tabId === activePanel;
    ctx.fillStyle = isActive ? `rgba(${hexToRGB(tab.color)},0.25)` : 'rgba(0,5,20,0.85)';
    ctx.fillRect(0, 0, 256, 64);
    ctx.strokeStyle = `rgba(${hexToRGB(tab.color)},${isActive ? 0.9 : 0.4})`;
    ctx.lineWidth = isActive ? 3 : 1.5;
    ctx.strokeRect(2, 2, 252, 60);
    ctx.font = 'bold 18px Orbitron, monospace';
    ctx.fillStyle = isActive ? `rgb(${hexToRGB(tab.color)})` : `rgba(${hexToRGB(tab.color)},0.6)`;
    ctx.textAlign = 'center';
    ctx.shadowColor = `rgb(${hexToRGB(tab.color)})`;
    ctx.shadowBlur = isActive ? 15 : 0;
    ctx.fillText(tab.label, 128, 40);
    if (zone.mesh.material.map) zone.mesh.material.map.dispose();
    zone.mesh.material.map = new THREE.CanvasTexture(canvas);
    zone.mesh.material.needsUpdate = true;
  });
}

// ── Activate zone action ──
function activateZone(zone) {
  zone.action();
  // Flash effect on mesh
  const origOpacity = zone.mesh.material.opacity;
  zone.mesh.material.opacity = 1;
  setTimeout(() => { if(zone.mesh.material) zone.mesh.material.opacity = origOpacity; }, 200);
  refreshTabMeshes();
  showGestureToast(zone.label);
}

// ── Gaze update: project center ray, detect dwell ──
function updateGaze(time) {
  if (!gazeCursor || !panelGroup) return;

  // Place gaze cursor 1m in front of camera
  const camDir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
  const camPos = new THREE.Vector3();
  camera.getWorldPosition(camPos);
  gazeCursor.position.copy(camPos).add(camDir.clone().multiplyScalar(1.0));
  gazeCursor.quaternion.copy(camera.quaternion);

  // Raycast from camera center
  gazeRaycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
  const targets = interactiveZones.map(z => z.mesh);
  const hits = gazeRaycaster.intersectObjects(targets);

  if (hits.length > 0) {
    const zone = interactiveZones.find(z => z.mesh === hits[0].object);
    if (zone !== gazeTarget) {
      gazeTarget = zone;
      gazeDwellStart = time;
      gazeProgressMesh.material.opacity = 0.9;
    } else {
      const elapsed = time - gazeDwellStart;
      const progress = Math.min(elapsed / GAZE_DWELL_MS, 1);
      // Update progress ring arc
      gazeProgressMesh.geometry.dispose();
      gazeProgressMesh.geometry = new THREE.RingGeometry(0.010, 0.013, 32, 1, 0, progress * Math.PI * 2);
      gazeProgressMesh.material.opacity = progress > 0 ? 0.9 : 0;
      if (progress >= 1) {
        activateZone(gazeTarget);
        gazeTarget = null;
        gazeDwellStart = null;
        gazeProgressMesh.geometry.dispose();
        gazeProgressMesh.geometry = new THREE.RingGeometry(0.010, 0.013, 32, 1, 0, 0);
        gazeProgressMesh.material.opacity = 0;
      }
    }
    // Highlight hovered tab
    updateHoverHighlight(zone);
  } else {
    if (gazeTarget !== null) {
      gazeTarget = null;
      gazeDwellStart = null;
      gazeProgressMesh.geometry.dispose();
      gazeProgressMesh.geometry = new THREE.RingGeometry(0.010, 0.013, 32, 1, 0, 0);
      gazeProgressMesh.material.opacity = 0;
      updateHoverHighlight(null);
    }
  }
}

let hoveredZone = null;
function updateHoverHighlight(zone) {
  if (hoveredZone === zone) return;
  hoveredZone = zone;
  interactiveZones.forEach(z => {
    const scale = z === zone ? 1.08 : 1.0;
    z.mesh.scale.set(scale, scale, 1);
  });
}

// ── Handle XR select event (screen tap / controller trigger) ──
function handleSelect(event) {
  if (!panelGroup) return;
  const source = event.inputSource;
  // Use gaze ray from camera center
  gazeRaycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
  const targets = interactiveZones.map(z => z.mesh);
  const hits = gazeRaycaster.intersectObjects(targets);
  if (hits.length > 0) {
    const zone = interactiveZones.find(z => z.mesh === hits[0].object);
    if (zone) activateZone(zone);
  }
}

// ── Create Canvas Texture (2D UI drawn on canvas → Three.js texture) ──
function makeCanvasTexture(width, height, drawFn) {
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  drawFn(ctx, width, height);
  return new THREE.CanvasTexture(canvas);
}

// ── Build/Update panel texture ──
function buildPanel(type) {
  const W = 1024, H = 768;
  let drawFn;
  switch(type) {
    case 'agents': drawFn = (c,w,h) => drawAgentsPanel(c,w,h); break;
    case 'char':   drawFn = (c,w,h) => drawCharPanel(c,w,h); break;
    case 'chat':   drawFn = (c,w,h) => drawChatPanel(c,w,h); break;
    case 'vault':  drawFn = (c,w,h) => drawVaultPanel(c,w,h); break;
    default: drawFn = (c,w,h) => drawAgentsPanel(c,w,h);
  }

  if (currentTextures[type]) {
    currentTextures[type].dispose();
  }
  const tex = makeCanvasTexture(W, H, drawFn);
  currentTextures[type] = tex;
  return tex;
}

// ── Create 3D Panel Group ──
function createPanelGroup() {
  const group = new THREE.Group();

  // Main panel mesh
  const panelW = 0.8, panelH = 0.6;
  const geo = new THREE.PlaneGeometry(panelW, panelH);
  const tex = buildPanel('agents');
  const mat = new THREE.MeshBasicMaterial({
    map: tex,
    transparent: true,
    opacity: 0.95,
    side: THREE.DoubleSide,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.name = 'panel-main';
  group.add(mesh);
  panelMeshes['main'] = mesh;

  // Glow border (slightly larger plane with additive)
  const borderGeo = new THREE.PlaneGeometry(panelW + 0.01, panelH + 0.01);
  const borderMat = new THREE.MeshBasicMaterial({
    color: 0x00ffff,
    transparent: true,
    opacity: 0.15,
    side: THREE.DoubleSide,
  });
  const border = new THREE.Mesh(borderGeo, borderMat);
  border.position.z = -0.001;
  group.add(border);

  // Particle ring
  const particleCount = 60;
  const pGeo = new THREE.BufferGeometry();
  const positions = new Float32Array(particleCount * 3);
  const radius = Math.max(panelW, panelH) * 0.65;
  for (let i = 0; i < particleCount; i++) {
    const angle = (i / particleCount) * Math.PI * 2;
    positions[i*3]   = Math.cos(angle) * radius;
    positions[i*3+1] = Math.sin(angle) * radius;
    positions[i*3+2] = (Math.random() - 0.5) * 0.05;
  }
  pGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const pMat = new THREE.PointsMaterial({ color: 0x00ffff, size: 0.008, transparent: true, opacity: 0.6 });
  const particles = new THREE.Points(pGeo, pMat);
  particles.name = 'particles';
  group.add(particles);

  // Vertical beam below
  const beamGeo = new THREE.CylinderGeometry(0.003, 0.003, 0.3, 8);
  const beamMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.4 });
  const beam = new THREE.Mesh(beamGeo, beamMat);
  beam.position.y = -panelH/2 - 0.15;
  group.add(beam);

  // ── Interactive tab zones (gaze / pinch / tap targets) ──
  createInteractiveZones(group);

  return group;
}

// ── XR Frame ──
function onXRFrame(time, frame) {
  const session = renderer.xr.getSession();
  const refSpace = renderer.xr.getReferenceSpace();

  if (!hitTestSourceRequested) {
    session.requestReferenceSpace('viewer').then(viewerSpace => {
      session.requestHitTestSource({ space: viewerSpace }).then(src => {
        hitTestSource = src;
      });
    });
    hitTestSourceRequested = true;
  }

  if (hitTestSource) {
    const hits = frame.getHitTestResults(hitTestSource);
    if (hits.length > 0) {
      const hit = hits[0];
      const pose = hit.getPose(refSpace);
      reticle.visible = true;
      reticle.matrix.fromArray(pose.transform.matrix);

      if (!panelPlaced) {
        document.getElementById('btn-place').style.display = 'block';
        document.getElementById('scan-hint').textContent = 'Bề mặt phát hiện! Nhấn đặt portal.';
        document.getElementById('hud-status-text').textContent = 'BỀ MẶT PHÁT HIỆN';
      }
    } else {
      reticle.visible = false;
      if (!panelPlaced) {
        document.getElementById('btn-place').style.display = 'none';
        document.getElementById('scan-hint').textContent = 'Hướng camera xuống bề mặt phẳng';
        document.getElementById('hud-status-text').textContent = 'ĐANG QUÉT...';
      }
    }
  }

  // ── Hand tracking update ──
  if (handTrackingAvailable && frame) {
    try { updateHandTracking(frame, refSpace); } catch(e) {}
  }

  // ── Gaze interaction update ──
  if (panelPlaced) {
    updateGaze(time);
    gazeCursor.visible = true;
  } else {
    if (gazeCursor) gazeCursor.visible = false;
  }

  // Animate panel
  if (panelGroup) {
    panelGroup.rotation.y = Math.sin(time * 0.0003) * 0.08;
    const particles = panelGroup.getObjectByName('particles');
    if (particles) particles.rotation.z = time * 0.0005;
    panelGroup.position.y += Math.sin(time * 0.001) * 0.0002;
  }

  // Animate reticle
  reticle.rotation.z = time * 0.001;

  renderer.render(scene, camera);
}

// ── Start AR ──
window.startAR = async function() {
  document.getElementById('loading-screen').style.display = 'flex';

  if (!navigator.xr) {
    startFallbackAR();
    return;
  }

  const supported = await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);
  if (!supported) {
    startFallbackAR();
    return;
  }

  await fetchUserData();
  initThree();

  try {
    xrSession = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test'],
      optionalFeatures: ['dom-overlay', 'hand-tracking'],
      domOverlay: { root: document.getElementById('ar-hud') }
    });

    renderer.xr.setReferenceSpaceType('local');
    await renderer.xr.setSession(xrSession);

    // ── Detect hand tracking support ──
    xrSession.addEventListener('inputsourceschange', (e) => {
      e.added.forEach(src => {
        if (src.hand) {
          handTrackingAvailable = true;
          initHandJoints('left');
          initHandJoints('right');
          document.getElementById('hud-status-text').textContent = 'HAND TRACKING ON';
          handPointerLine.visible = true;
        }
      });
      e.removed.forEach(src => {
        if (src.hand) handPointerLine.visible = false;
      });
    });

    // ── Screen tap / controller trigger ──
    xrSession.addEventListener('select', handleSelect);

    xrSession.addEventListener('end', () => {
      hitTestSource = null;
      hitTestSourceRequested = false;
      exitAR();
    });

    renderer.setAnimationLoop(onXRFrame);

    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('ar-hud').style.display = 'block';

    // ── Instruction hint update ──
    document.getElementById('scan-hint').textContent = 'Nhìn vào tab để chọn (1.5s) · Chạm màn hình để tương tác';

  } catch (err) {
    console.error('XR error:', err);
    startFallbackAR();
  }
};

// ── Fallback AR (camera + canvas overlay for non-WebXR) ──
async function startFallbackAR() {
  await fetchUserData();

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });

    document.getElementById('fallback-screen').style.display = 'block';
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('loading-screen').style.display = 'none';

    const video = document.getElementById('camera-feed');
    video.srcObject = stream;
    await video.play();

    const canvas = document.getElementById('ar-overlay-canvas');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const ctx = canvas.getContext('2d');

    // HUD overlay
    const hudEl = document.createElement('div');
    hudEl.id = 'fallback-hud';
    hudEl.style.cssText = 'position:fixed;inset:0;z-index:160;pointer-events:none;';
    hudEl.innerHTML = `
      <div style="position:absolute;top:0;left:0;right:0;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,rgba(0,0,0,.6) 0%,transparent 100%)">
        <div style="font-family:Orbitron,sans-serif;font-size:12px;font-weight:900;color:#00ffff;letter-spacing:4px;text-shadow:0 0 15px #00ffff88">VƯƠNG ĐẾ AR</div>
        <div style="font-size:9px;color:#ffaa00;letter-spacing:2px">⚠ CHẾ ĐỘ MÔ PHỎNG</div>
      </div>
      <div style="position:absolute;bottom:0;left:0;right:0;padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px;background:linear-gradient(0deg,rgba(0,0,0,.7) 0%,transparent 100%);pointer-events:all">
        <div style="font-size:10px;color:rgba(255,170,0,0.8);letter-spacing:2px;text-align:center">Thiết bị không hỗ trợ WebXR — Đang chạy chế độ mô phỏng AR</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center" id="sim-tabs">
          <button class="panel-btn active" onclick="simSwitch('agents')" style="padding:8px 16px;background:rgba(0,255,255,.15);border:1px solid #00ffff;color:#00ffff;font-family:Orbitron,sans-serif;font-size:8px;letter-spacing:2px;cursor:pointer">THẦN LINH</button>
          <button class="panel-btn" onclick="simSwitch('char')" style="padding:8px 16px;background:rgba(0,255,255,.05);border:1px solid rgba(0,255,255,.3);color:rgba(0,255,255,.7);font-family:Orbitron,sans-serif;font-size:8px;letter-spacing:2px;cursor:pointer">NHÂN VẬT</button>
          <button class="panel-btn" onclick="simSwitch('chat')" style="padding:8px 16px;background:rgba(0,255,255,.05);border:1px solid rgba(0,255,255,.3);color:rgba(0,255,255,.7);font-family:Orbitron,sans-serif;font-size:8px;letter-spacing:2px;cursor:pointer">ĐỐI THOẠI</button>
          <button class="panel-btn" onclick="simSwitch('vault')" style="padding:8px 16px;background:rgba(0,255,255,.05);border:1px solid rgba(0,255,255,.3);color:rgba(0,255,255,.7);font-family:Orbitron,sans-serif;font-size:8px;letter-spacing:2px;cursor:pointer">KHO BÁU</button>
        </div>
        <button onclick="exitFallbackAR(stream)" style="padding:10px 28px;background:transparent;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.5);font-family:Orbitron,sans-serif;font-size:9px;letter-spacing:2px;cursor:pointer">✕ THOÁT AR</button>
      </div>
    `;
    document.body.appendChild(hudEl);

    let simPanel = 'agents';
    let animFrame;
    let panelOpacity = 0;
    let panelY = 0;
    let swipeTouchStartX = 0, swipeTouchStartY = 0;

    window.simSwitch = function(type) {
      simPanel = type;
    };

    // ── Swipe left/right to switch panels ──
    canvas.addEventListener('touchstart', e => {
      swipeTouchStartX = e.touches[0].clientX;
      swipeTouchStartY = e.touches[0].clientY;
    }, { passive: true });

    canvas.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - swipeTouchStartX;
      const dy = e.changedTouches[0].clientY - swipeTouchStartY;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
        const idx = panels.indexOf(simPanel);
        if (dx < 0) simPanel = panels[(idx + 1) % panels.length];
        else         simPanel = panels[(idx + panels.length - 1) % panels.length];
        showSimToast(simPanel);
      }
    }, { passive: true });

    // ── Double tap to switch panel ──
    let lastTap = 0;
    canvas.addEventListener('touchend', e => {
      const now = Date.now();
      if (now - lastTap < 300) {
        const idx = panels.indexOf(simPanel);
        simPanel = panels[(idx + 1) % panels.length];
        showSimToast(simPanel);
      }
      lastTap = now;
    }, { passive: true });

    function showSimToast(type) {
      const names = { agents: '⬡ THẦN LINH', char: '☯ NHÂN VẬT', chat: '💬 ĐỐI THOẠI', vault: '🏺 KHO BÁU' };
      let t = document.getElementById('sim-toast');
      if (!t) {
        t = document.createElement('div');
        t.id = 'sim-toast';
        t.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,255,255,0.15);border:1px solid rgba(0,255,255,0.5);color:#00ffff;font-family:Orbitron,sans-serif;font-size:13px;letter-spacing:3px;padding:14px 28px;z-index:500;pointer-events:none;transition:opacity 0.3s;';
        document.body.appendChild(t);
      }
      t.textContent = names[type] || type;
      t.style.opacity = '1';
      setTimeout(() => { t.style.opacity = '0'; }, 1000);
    }

    window.exitFallbackAR = function(s) {
      s.getTracks().forEach(t => t.stop());
      cancelAnimationFrame(animFrame);
      hudEl.remove();
      document.getElementById('fallback-screen').style.display = 'none';
      document.getElementById('start-screen').style.display = 'flex';
    };

    function renderOverlay(ts) {
      animFrame = requestAnimationFrame(renderOverlay);
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      panelOpacity = Math.min(1, panelOpacity + 0.03);
      panelY = Math.sin(ts * 0.001) * 5;

      const PW = Math.min(window.innerWidth * 0.85, 540);
      const PH = Math.min(window.innerHeight * 0.6, 500);
      const px = (window.innerWidth - PW) / 2;
      const py = (window.innerHeight - PH) / 2 + panelY - 40;

      // Scan lines on camera
      ctx.strokeStyle = 'rgba(0,255,255,0.04)';
      ctx.lineWidth = 1;
      for (let y = 0; y < canvas.height; y += 6) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // Corner brackets on screen
      const bsize = 30;
      ctx.strokeStyle = `rgba(0,255,255,${0.4 * panelOpacity})`;
      ctx.lineWidth = 2;
      [[0,0],[canvas.width,0],[0,canvas.height],[canvas.width,canvas.height]].forEach(([x,y]) => {
        const sx = x === 0 ? 20 : canvas.width - 20 - bsize;
        const sy = y === 0 ? 20 : canvas.height - 20 - bsize;
        ctx.beginPath();
        ctx.moveTo(sx, y === 0 ? sy + bsize : sy);
        ctx.lineTo(sx, y === 0 ? sy : sy + bsize);
        ctx.lineTo(x === 0 ? sx + bsize : sx, y === 0 ? sy : sy + bsize);
        ctx.stroke();
      });

      // Panel shadow/glow
      ctx.save();
      ctx.globalAlpha = panelOpacity * 0.3;
      ctx.shadowColor = '#00ffff';
      ctx.shadowBlur = 40;
      ctx.fillStyle = 'rgba(0,255,255,0.1)';
      ctx.fillRect(px - 10, py - 10, PW + 20, PH + 20);
      ctx.restore();

      // Draw panel
      ctx.save();
      ctx.globalAlpha = panelOpacity;
      const offscreen = document.createElement('canvas');
      offscreen.width = 1024; offscreen.height = 768;
      const octx = offscreen.getContext('2d');

      switch(simPanel) {
        case 'agents': drawAgentsPanel(octx, 1024, 768); break;
        case 'char':   drawCharPanel(octx, 1024, 768); break;
        case 'chat':   drawChatPanel(octx, 1024, 768); break;
        case 'vault':  drawVaultPanel(octx, 1024, 768); break;
      }

      ctx.drawImage(offscreen, px, py, PW, PH);
      ctx.restore();

      // Floating particles around panel
      for (let i = 0; i < 8; i++) {
        const angle = (i / 8) * Math.PI * 2 + ts * 0.001;
        const r = Math.max(PW, PH) * 0.55;
        const px2 = window.innerWidth/2 + Math.cos(angle) * r;
        const py2 = window.innerHeight/2 - 40 + Math.sin(angle) * r * 0.4;
        ctx.beginPath();
        ctx.arc(px2, py2, 3, 0, Math.PI*2);
        ctx.fillStyle = `rgba(0,255,255,${0.3 * panelOpacity})`;
        ctx.fill();
      }
    }

    requestAnimationFrame(renderOverlay);

  } catch (err) {
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('start-screen').style.display = 'flex';
    document.getElementById('ar-support-msg').textContent =
      '⚠ Không thể truy cập camera. Vui lòng cấp quyền camera và thử lại.';
    document.getElementById('ar-support-msg').style.color = '#ff6644';
  }
}

// ── Exit AR ──
window.exitAR = function() {
  if (xrSession) { xrSession.end(); xrSession = null; }
  if (renderer) renderer.setAnimationLoop(null);
  hitTestSource = null;
  hitTestSourceRequested = false;
  panelPlaced = false;
  panelGroup = null;

  document.getElementById('ar-hud').style.display = 'none';
  document.getElementById('start-screen').style.display = 'flex';

  resetPanel();
};
</script>
